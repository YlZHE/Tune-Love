name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  version:
    runs-on: windows-2022  # VS 2022: build.rs pins the "Visual Studio 17 2022" CMake generator
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Fail closed: the script must exit 0 AND print exactly the tag without the leading "v".
      - name: Check tag against app versions
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $out = (& node scripts/release-version.mjs $env:TAG | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "release-version.mjs failed for ${env:TAG}: $out" }
          $expected = $env:TAG.Substring(1)
          if ($out -ne $expected) { throw "release-version.mjs printed '$out', expected '$expected'" }
          "version=$out" >> $env:GITHUB_OUTPUT

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: [version, ci]
    runs-on: windows-2022  # VS 2022: build.rs pins the "Visual Studio 17 2022" CMake generator
    timeout-minutes: 90
    # Build steps run third-party code (npm scripts, build.rs, downloads): no write token here.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reference-agent-x64
          path: reference/build/x64

      # Fetches the pinned dependencies so that their licence texts can be bundled.
      - run: pwsh reference/bootstrap.ps1

      - name: Cache pinned CMake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/vendor/tools
          key: cmake-3.30.5-5ab6e1fa

      - run: npm run fetch:cmake
      - run: npm run fetch:python
      - run: npm ci

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Checksums
        run: |
          $built = Join-Path 'src-tauri/target/release/bundle/nsis' "Tune Love_${env:VERSION}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $built)) { throw "installer not found: $built" }
          # GitHub renames release assets containing spaces, so publish under a space-free name.
          $name = "Tune-Love_${env:VERSION}_x64-setup.exe"
          Copy-Item -LiteralPath $built -Destination $name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash.ToLowerInvariant()
          # sha256sum format, binary mode: "<hash> *<file name>"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$hash *$name`n")
          Get-Content SHA256SUMS.txt
          "INSTALLER=$name" >> $env:GITHUB_ENV

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            ${{ env.INSTALLER }}
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: windows-2022  # VS 2022: build.rs pins the "Visual Studio 17 2022" CMake generator
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only the release notes are needed from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      # The token is exposed to this single step only. Idempotent: a re-run after a partial
      # failure uploads into the existing draft instead of failing on "already exists".
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $files = @(
            (Join-Path 'release-assets' "Tune-Love_${env:VERSION}_x64-setup.exe"),
            (Join-Path 'release-assets' 'SHA256SUMS.txt')
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "missing release asset: $f" }
          }
          # "gh release view <tag>" does not find drafts, so look the tag up in the release list.
          $found = gh release list --repo $env:REPO --limit 200 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed' }
          if ($found -contains $env:TAG) {
            gh release upload $env:TAG @files --clobber --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
          } else {
            gh release create $env:TAG @files --draft --title "Tune Love $env:VERSION" --notes-file .github/release-notes.md --repo $env:REPO
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
