[package]
name = "devocal-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
devocal-core = { path = "../core" }
# ort 2.0.0-rc.13 is the latest 2.x release on 2026-10-02 (2.0 final not yet published);
# it wraps ONNX Runtime 1.28. CPU only: `download-binaries` fetches pyke's prebuilt ONNX
# Runtime at build time and links it statically (no onnxruntime.dll to ship). Pinned
# exactly because release candidates may break the API.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-native",
] }
rtrb = "0.3"
wasapi = { path = "../../src-tauri/vendor/wasapi" }

[target.'cfg(windows)'.dependencies]
# Same features as devocal-core, plus Performance (QueryPerformanceCounter) and Security
# (CreateEventW's SECURITY_ATTRIBUTES parameter is gated behind it). The app pipe needs
# Pipes, Storage_FileSystem (ReadFile/WriteFile/pipe flags), IO (OVERLAPPED) and
# Security_Authorization (SID/SDDL conversion).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[dev-dependencies]
serde_json = "1"
devocal-core = { path = "../core", features = ["fake"] }

# The probe's lag analysis is pure and unit-tested (`cargo test --workspace` runs them).
[[example]]
name = "latency_probe"
test = true
