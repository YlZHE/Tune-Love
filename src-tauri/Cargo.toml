[package]
name = "tune-love"
version = "0.1.0"
edition = "2021"
default-run = "tune-love"

[lib]
name = "tune_love"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nowplaying = "=0.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
base64 = "0.22"
rustfft = "6.4"
devocal-core = { path = "../devocal/core" }
# One app per user: a second instance would restore (undo) the first one's player hold.
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
png = "0.17.16"
wasapi = { version = "=0.24.0", path = "vendor/wasapi" }
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[dev-dependencies]
devocal-core = { path = "../devocal/core", features = ["fake"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
